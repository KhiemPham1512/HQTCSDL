<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Smart Heritage</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e8f5ef,#f5f7f6);padding:20px}
    .login-card{width:min(100%,430px);background:#fff;border:1px solid #e1e8e4;border-radius:16px;padding:32px;box-shadow:0 15px 45px rgba(23,63,51,.08)}
    .login-brand{text-align:center;font-size:23px;font-weight:bold;color:#173f33;margin-bottom:8px}
    .login-subtitle{text-align:center;color:#77847e;margin-bottom:28px}
    .login-card .btn{width:100%;margin-top:8px}
    .login-help{font-size:12px;color:#77847e;line-height:1.6;margin-top:18px}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-brand">SMART <span style="color:#176b52">HERITAGE</span></div>
    <p class="login-subtitle">Hệ thống quản trị di sản văn hóa</p>
    <div id="loginMessage" aria-live="polite"></div>
    <form id="loginForm">
      <div class="form-group"><label for="email">Email / Tên đăng nhập</label><input class="form-control" id="email" name="email" autocomplete="username" required></div>
      <div class="form-group"><label for="password">Mật khẩu</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" id="loginButton" type="submit">Đăng nhập</button>
    </form>
    <p class="login-help">Đăng nhập bằng tài khoản được cấp. Quyền truy cập thực tế phải được xác thực tại máy chủ.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body></html>
